# Guardian gate manifest — configuration only.
# Read alongside docs/guardian/30_TDD/GUARDIAN_EXECUTION_PROTOCOL.md.

schema_version = 1
gate_id = "phase2-2c"
status = "not-started"

baseline_sha = "10a20abc5962ca15d8bccca731d226efd7ecea56"

tdd_file = "docs/guardian/30_TDD/gates/phase2-2c-tdd.md"

owned_normative_ids = [
    "P2-VM-001",
    "P2-VM-002",
]

dependencies = ["phase2-2a", "phase2-2b"]

[allowed_scope]
paths = [
    # This gate produces evidence, not new production code (implementation
    # handoff §20: "Implementation scope: none — this gate produces
    # evidence, not new code, beyond whatever minimal test harness the VM
    # run itself needs").
    "docs/evidence/p2/**",
    # A minimal VM-only test harness, if genuinely needed, is the only
    # code-shaped exception.
    "crates/guardian-daemon/tests/**",
]

[forbidden_scope]
paths = [
    "crates/guardian-core/**",
    "crates/guardian-daemon/src/**",
    "crates/guardian-helper/**",
    "crates/guardian-gui/**",
    "crates/guardian-tui/**",
    "crates/guardian-cli/**",
    "crates/guardian-indicator/**",
    "crates/guardian-client/**",
]

required_test_layers = ["layer4-vm"]

[validation_commands]
fmt = "cargo fmt --check"
clippy = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
test = "cargo test --workspace"
vm = "real disposable Ubuntu 26.04.1 VM run (guardian-g9 or equivalent) — see gate TDD"
expected_baseline = "unchanged from Gate 2b's closing count; this gate adds no new unit/integration tests beyond an optional minimal VM harness"

required_evidence = [
    "docs/evidence/p2/ — real stop/start of an already-evidenced unit (e.g. cups.service) producing a real, observable Incidents1 transition (P2-VM-001)",
    "docs/evidence/p2/ — real guardian-daemon restart during an open incident, confirmed to lose that incident and reset the ingress epoch (P2-VM-002)",
    "both artifacts reproducible from a fresh VM clone at this gate's baseline_sha",
]

commit_policy = "leave-uncommitted-for-independent-review"

next_gate = "none — closes TDD-contract Phase 2's internal gate sequence"
